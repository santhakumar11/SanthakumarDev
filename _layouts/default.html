<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f7f3">
    {% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  </head>
  <body>
    <header class="site-header" id="top">
      <nav class="nav-shell" aria-label="Main navigation">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
          <span class="brand-mark" aria-hidden="true">s<span>.</span></span>
          <span class="brand-name">{{ site.title }}<span class="brand-period">.</span></span>
        </a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
          <span class="sr-only">Toggle navigation</span>
          <span class="menu-icon" aria-hidden="true"></span>
        </button>
        <div class="nav-links" id="primary-navigation">
          <a href="{{ '/' | relative_url }}#writing">Writing</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a class="nav-contact" href="https://github.com/santhakumar11" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
        </div>
      </nav>
    </header>

    <main class="page-shell">
      {{ content }}
    </main>

    <footer class="site-footer">
      <a class="footer-brand" href="{{ '/' | relative_url }}">Santhakumar<span>.</span></a>
      <p>Made with curiosity and a little bit of CSS.</p>
      <a class="footer-top" href="#top">Back to top <span aria-hidden="true">↑</span></a>
    </footer>
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
